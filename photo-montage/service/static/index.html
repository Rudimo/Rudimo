<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinematic Montage</title>
<style>
  :root{--bg:#0d0f14;--panel:#161a22;--line:#262c38;--text:#e8ebf2;--dim:#8b93a5;--accent:#e8a33d;--ok:#4cc38a;--err:#e5534b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1060px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--dim);margin:0 0 24px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .drop{border:2px dashed var(--line);border-radius:12px;min-height:180px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;cursor:pointer;color:var(--dim);transition:.15s;overflow:hidden;position:relative}
  .drop.over{border-color:var(--accent);color:var(--accent)}
  .drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px}
  label.lbl{display:block;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px}
  textarea,input[type=text],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font:inherit;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);border-radius:100px;padding:6px 14px;cursor:pointer;color:var(--dim);user-select:none;transition:.12s}
  .chip.on{border-color:var(--accent);color:var(--accent);background:rgba(232,163,61,.08)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{background:var(--accent);color:#151007;border:0;border-radius:10px;padding:12px 22px;font:600 15px/1 inherit;cursor:pointer;margin-top:18px;width:100%}
  .btn:disabled{opacity:.45;cursor:default}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:14px;display:none}
  .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
  .status{color:var(--dim);font-size:13px;margin-top:8px;min-height:18px}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:26px}
  .shot{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .shot img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover}
  .shot .m{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:13px;color:var(--dim)}
  .shot a{color:var(--accent);text-decoration:none}
  .errbox{color:var(--err);font-size:13px;white-space:pre-wrap;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Cinematic Montage</h1>
  <p class="sub">Редактирование фото с сохранением людей: свет, глубина, новые объекты в сцене. Nano Banana Pro.</p>

  <div class="grid">
    <div class="card">
      <div class="drop" id="drop">
        <span id="dropHint">Перетащите фото или кликните</span>
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
      </div>
      <label class="lbl">Что добавить/изменить в сцене</label>
      <textarea id="prompt" rows="4" placeholder="Например: add two female Russian police officers in dress uniform behind the men, and a lowered UAZ Patriot police pickup in the background…"></textarea>
      <label class="lbl">Токен сервиса (если включён)</label>
      <input type="password" id="token" placeholder="Bearer-токен, хранится только в этом браузере">
    </div>

    <div class="card">
      <label class="lbl" style="margin-top:0">Нейросеть</label>
      <div class="chips" id="models"></div>
      <label class="lbl">Стили</label>
      <div class="chips" id="styles"></div>
      <label class="lbl">Ориентации</label>
      <div class="chips" id="aspects">
        <span class="chip on" data-v="16:9">16:9</span>
        <span class="chip on" data-v="9:16">9:16</span>
        <span class="chip" data-v="1:1">1:1</span>
        <span class="chip" data-v="4:3">4:3</span>
        <span class="chip" data-v="3:4">3:4</span>
      </div>
      <label class="lbl">Дубли на комбинацию</label>
      <div class="chips" id="variants">
        <span class="chip on" data-v="1">1</span>
        <span class="chip" data-v="2">2</span>
        <span class="chip" data-v="3">3</span>
      </div>
      <label class="lbl">Размер</label>
      <div class="chips" id="sizes">
        <span class="chip" data-v="1K">1K</span>
        <span class="chip on" data-v="2K">2K</span>
        <span class="chip" data-v="4K">4K</span>
      </div>
      <button class="btn" id="go" disabled>Сгенерировать</button>
      <div class="bar" id="bar"><i></i></div>
      <div class="status" id="status"></div>
      <div class="errbox" id="errors"></div>
    </div>
  </div>

  <div class="gallery" id="gallery"></div>
</div>

<script>
const $=s=>document.querySelector(s);
let file=null, polling=null;

const authHeaders=()=>{const t=$('#token').value.trim();return t?{'Authorization':'Bearer '+t}:{}};

fetch('/api/styles',{headers:authHeaders()}).then(r=>r.ok?r.json():{}).then(st=>{
  const box=$('#styles');
  for(const [k,title] of Object.entries(st)){
    const c=document.createElement('span');
    c.className='chip'+(k==='golden'?' on':'');c.dataset.v=k;c.textContent=title;
    box.appendChild(c);
  }
});

fetch('/api/models',{headers:authHeaders()}).then(r=>r.ok?r.json():{models:{}}).then(({default:def,models})=>{
  const box=$('#models');
  for(const [k,title] of Object.entries(models)){
    const c=document.createElement('span');
    c.className='chip'+(k===def?' on':'');c.dataset.v=k;c.textContent=title;
    box.appendChild(c);
  }
});

document.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');if(!chip)return;
  const single=['variants','sizes','models'].includes(chip.parentElement.id);
  if(single)chip.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  chip.classList.toggle('on',single?true:!chip.classList.contains('on'));
});

const drop=$('#drop');
drop.addEventListener('click',()=>$('#file').click());
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');setFile(e.dataTransfer.files[0])});
$('#file').addEventListener('change',e=>setFile(e.target.files[0]));

function setFile(f){
  if(!f||!f.type.startsWith('image/'))return;
  file=f;$('#go').disabled=false;
  const img=document.createElement('img');img.src=URL.createObjectURL(f);
  drop.querySelectorAll('img').forEach(i=>i.remove());drop.appendChild(img);
}

const picked=id=>[...document.querySelectorAll(`#${id} .chip.on`)].map(c=>c.dataset.v);

$('#go').addEventListener('click',async()=>{
  if(!file)return;
  $('#go').disabled=true;$('#errors').textContent='';$('#gallery').innerHTML='';
  $('#bar').style.display='block';$('#bar i').style.width='0';
  $('#status').textContent='Отправляю задачу…';
  const payload={
    prompt:$('#prompt').value,
    styles:picked('styles'),
    aspects:picked('aspects'),
    variants:+picked('variants')[0],
    image_size:picked('sizes')[0],
    model_id:picked('models')[0],
  };
  const fd=new FormData();fd.append('image',file);fd.append('payload',JSON.stringify(payload));
  try{
    const r=await fetch('/api/jobs',{method:'POST',body:fd,headers:authHeaders()});
    if(!r.ok)throw new Error((await r.json()).detail||r.status);
    const {job_id}=await r.json();
    poll(job_id);
  }catch(e){fail('Ошибка: '+e.message)}
});

function fail(msg){$('#status').textContent='';$('#errors').textContent=msg;$('#go').disabled=false;$('#bar').style.display='none'}

function poll(id){
  clearInterval(polling);
  polling=setInterval(async()=>{
    let j;
    try{
      const r=await fetch('/api/jobs/'+id,{headers:authHeaders()});
      if(!r.ok)throw new Error(r.status);
      j=await r.json();
    }catch(e){return}
    $('#bar i').style.width=Math.round(100*j.completed/j.total)+'%';
    $('#status').textContent=`Готово ${j.completed}/${j.total} · статус: ${j.status}`;
    render(j);
    if(['done','partial','failed'].includes(j.status)){
      clearInterval(polling);$('#go').disabled=false;
      if(j.errors.length)$('#errors').textContent=j.errors.map(e=>e.task+': '+e.error).join('\n');
    }
  },2500);
}

function render(j){
  const g=$('#gallery');
  for(const img of j.images){
    if(document.getElementById(img.name))continue;
    const d=document.createElement('div');d.className='shot';d.id=img.name;
    const t=$('#token').value.trim();
    const src=img.url+(t?'':'');
    d.innerHTML=`<img loading="lazy"><div class="m"><span>${img.style} · ${img.aspect}</span><a download="${img.name}">скачать</a></div>`;
    fetch(img.url,{headers:authHeaders()}).then(r=>r.blob()).then(b=>{
      const u=URL.createObjectURL(b);
      d.querySelector('img').src=u;d.querySelector('a').href=u;
    });
    g.appendChild(d);
  }
}
</script>
</body>
</html>
